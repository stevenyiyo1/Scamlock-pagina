<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Scam Lock — Redireccionando...</title>
  <script>
    // GitHub Pages SPA router redirect
    (function () {
      var l = window.location;
      var pathSegments = l.pathname.split('/').filter(Boolean);
      var isGitHubPages = l.hostname.endsWith('github.io');
      
      // En GitHub Pages, el primer segmento suele ser el nombre del repositorio (ej: /scamlock/)
      var repoBase = isGitHubPages && pathSegments.length > 0 ? '/' + pathSegments[0] + '/' : '/';
      var targetPath = isGitHubPages && pathSegments.length > 1 ? '/' + pathSegments.slice(1).join('/') : l.pathname;

      var url = l.origin + repoBase + '?p=' + encodeURIComponent(targetPath) + (l.search ? '&' + l.search.slice(1) : '') + l.hash;
      window.location.replace(url);
    })();
  </script>
</head>
<body style="background-color: #090a0f; color: #f43f5e; font-family: monospace; text-align: center; padding-top: 100px;">
  <h2>Redirigiendo a Scam Lock...</h2>
  <p style="color: #94a3b8;">Si no eres redirigido automáticamente, <a href="/" style="color: #ef4444;">haz clic aquí para volver al inicio</a>.</p>
</body>
</html>
