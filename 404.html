<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Scam Lock — Redireccionando...</title>
  <script>
    // GitHub Pages SPA router redirect
    // Captura rutas como /privacy, /terms, /security, /support y las envía a index.html?p=...
    (function () {
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var pathname = l.pathname;
      // If deployed in a subpath like /repo-name/
      var search = l.search;
      var hash = l.hash;
      
      // Preserve the target path in a query parameter so RouterContext can read it
      var targetPath = pathname;
      var url = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?p=' + encodeURIComponent(targetPath) + (search ? '&' + search.slice(1) : '') + hash;
      window.location.replace(url);
    })();
  </script>
</head>
<body style="background-color: #090a0f; color: #f43f5e; font-family: monospace; text-align: center; padding-top: 100px;">
  <h2>Redirigiendo a Scam Lock...</h2>
  <p style="color: #94a3b8;">Si no eres redirigido automáticamente, <a href="/" style="color: #ef4444;">haz clic aquí para volver al inicio</a>.</p>
</body>
</html>
